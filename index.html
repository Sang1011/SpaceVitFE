<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F7FB" />
    <title>SpaceVit</title>
    <script>
      // Chạy trước khi React vẽ để không bị nháy màu sáng ở chế độ tối.
      // Giữ đồng bộ với src/theme/theme-context.ts (khóa 'scw-theme', màu theme-color).
      (function () {
        try {
          var m = localStorage.getItem('scw-theme');
          var dark = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0E1017' : '#F6F7FB');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
